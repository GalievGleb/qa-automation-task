[pytest]
minversion = 9.0
testpaths = tests
# Корень проекта в sys.path — для импортов пакетов верхнего уровня
# (config, data, locators, pages) из тестов и conftest.
pythonpath = .

addopts =
    -v
    --strict-markers
    --tb=short
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=test-results
    --alluredir=allure-results
    --clean-alluredir

# Логирование: шаги видно в консоли, полный лог пишется в файл.
# Каталог logs/ намеренно отделён от test-results/: последний pytest-playwright
# очищает на старте сессии, и лог молча терялся бы из CI-артефактов.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

markers =
    smoke: быстрые проверки-«дымовые тесты»
    login: сценарии, связанные с логином
    negative: негативные сценарии / невалидный ввод
